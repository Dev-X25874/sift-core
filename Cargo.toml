[package]
name = "sift-core"
version = "0.1.0"
edition = "2021"
autobenches = false
description = "A tiny LSM-backed hybrid (vector + full-text) search engine — hand-rolled storage, ANN, BM25, and RRF in a single embeddable Rust library."
license = "MIT"

[lib]
name = "sift_core"
path = "src/lib.rs"

[[bin]]
name = "sift-core"
path = "src/main.rs"

[[bin]]
name = "sift-bench"
path = "benches/bench.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
